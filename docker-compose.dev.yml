# Docker Compose para Ambiente de Desenvolvimento
# Inclui hot reload, ferramentas de debug e UIs administrativas

version: '3.8'

services:
  # ==================== BANCOS DE DADOS ====================
  
  postgres:
    image: postgres:15-alpine
    container_name: postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: users_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data
    networks:
      - pedidos-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7-jammy
    container_name: mongodb-dev
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: orders_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data-dev:/data/db
    networks:
      - pedidos-network
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/orders_db --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-dev
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq-data-dev:/var/lib/rabbitmq
    networks:
      - pedidos-network
    restart: unless-stopped
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5

  # ==================== FERRAMENTAS DE ADMIN ====================
  
  adminer:
    image: adminer:latest
    container_name: adminer-dev
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: nette
    networks:
      - pedidos-network
    restart: unless-stopped
    depends_on:
      - postgres

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express-dev
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin@mongodb:27017/
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
    networks:
      - pedidos-network
    restart: unless-stopped
    depends_on:
      - mongodb

  # ==================== MICROSERVIÇOS (DEV MODE) ====================
  
  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile.dev
      no_cache: true
    container_name: user-service-dev
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: users_db
      JWT_SECRET: dev_super_secret_key_change_in_production
      JWT_EXPIRATION: 24h
      LOG_LEVEL: debug
      ENV: development
    volumes:
      - ./services/user-service:/app
      - /app/bin  # Excluir binários
    networks:
      - pedidos-network
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command: air -c .air.toml

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile.dev
      no_cache: true
    container_name: order-service-dev
    ports:
      - "8002:8002"
    environment:
      PORT: 8002
      MONGO_URI: mongodb://admin:admin@mongodb:27017
      MONGO_DATABASE: orders_db
      JWT_SECRET: dev_super_secret_key_change_in_production
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      LOG_LEVEL: debug
      ENV: development
    volumes:
      - ./services/order-service:/app
      - /app/bin  # Excluir binários
    networks:
      - pedidos-network
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: air -c .air.toml

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile.dev
      no_cache: true
    container_name: notification-service-dev
    ports:
      - "8003:8003"
    environment:
      PORT: 8003
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: ${SMTP_USER:-your_email@gmail.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-your_app_password}
      EMAIL_FROM: noreply@pedidosonline.com
      LOG_LEVEL: debug
      ENV: development
    volumes:
      - ./services/notification-service:/app
      - /app/bin  # Excluir binários
    networks:
      - pedidos-network
    restart: "no"
    depends_on:
      rabbitmq:
        condition: service_healthy
    command: air -c .air.toml

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile.dev
      no_cache: true
    container_name: api-gateway-dev
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      USER_SERVICE_URL: http://user-service:8001
      ORDER_SERVICE_URL: http://order-service:8002
      LOG_LEVEL: debug
      ENV: development
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    volumes:
      - ./services/api-gateway:/app
      - /app/bin  # Excluir binários
    networks:
      - pedidos-network
    restart: "no"
    depends_on:
      - user-service
      - order-service
    command: air -c .air.toml

  # ==================== FRONTEND (DEV MODE) ====================
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      no_cache: true
    container_name: frontend-dev
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
      NODE_ENV: development
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Usar node_modules do container
    networks:
      - pedidos-network
    restart: "no"
    depends_on:
      - api-gateway
    command: npm run dev -- --host 0.0.0.0 --port 3000

# ==================== VOLUMES ====================

volumes:
  postgres-data-dev:
    driver: local
  mongodb-data-dev:
    driver: local
  rabbitmq-data-dev:
    driver: local

# ==================== NETWORKS ====================

networks:
  pedidos-network:
    driver: bridge
    name: pedidos-network-dev
