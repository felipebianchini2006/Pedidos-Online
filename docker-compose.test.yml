version: '3.8'

services:
  # PostgreSQL for User Service
  postgres-test:
    image: postgres:15-alpine
    container_name: pedidos-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: users_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pedidos-test-network

  # MongoDB for Order Service
  mongodb-test:
    image: mongo:7
    container_name: pedidos-mongodb-test
    environment:
      MONGO_INITDB_DATABASE: orders_db
    ports:
      - "27018:27017"
    volumes:
      - mongodb_test_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pedidos-test-network

  # RabbitMQ for messaging
  rabbitmq-test:
    image: rabbitmq:3-management-alpine
    container_name: pedidos-rabbitmq-test
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq_test_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pedidos-test-network

  # User Service
  user-service-test:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: pedidos-user-service-test
    environment:
      PORT: 8001
      DB_HOST: postgres-test
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: users_db
      JWT_SECRET: test_jwt_secret_key_for_integration_tests
      JWT_EXPIRATION: 24h
      GIN_MODE: release
    ports:
      - "8001:8001"
    depends_on:
      postgres-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pedidos-test-network
    restart: on-failure

  # Order Service
  order-service-test:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: pedidos-order-service-test
    environment:
      PORT: 8002
      MONGO_URI: mongodb://mongodb-test:27017
      MONGO_DATABASE: orders_db
      JWT_SECRET: test_jwt_secret_key_for_integration_tests
      RABBITMQ_URL: amqp://guest:guest@rabbitmq-test:5672/
      USER_SERVICE_URL: http://user-service-test:8001
      GIN_MODE: release
    ports:
      - "8002:8002"
    depends_on:
      mongodb-test:
        condition: service_healthy
      rabbitmq-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pedidos-test-network
    restart: on-failure

  # Notification Service
  notification-service-test:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: pedidos-notification-service-test
    environment:
      PORT: 8003
      RABBITMQ_URL: amqp://guest:guest@rabbitmq-test:5672/
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      EMAIL_FROM: noreply@pedidosonline-test.com
      GIN_MODE: release
    ports:
      - "8003:8003"
    depends_on:
      rabbitmq-test:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pedidos-test-network
    restart: on-failure

  # API Gateway
  api-gateway-test:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: pedidos-api-gateway-test
    environment:
      PORT: 8000
      USER_SERVICE_URL: http://user-service-test:8001
      ORDER_SERVICE_URL: http://order-service-test:8002
      GIN_MODE: release
      ENABLE_RATE_LIMIT: "true"
      RATE_LIMIT_REQUESTS: "100"
      RATE_LIMIT_WINDOW: "60s"
    ports:
      - "8000:8000"
    depends_on:
      user-service-test:
        condition: service_healthy
      order-service-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pedidos-test-network
    restart: on-failure

  # MailHog for email testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: pedidos-mailhog-test
    ports:
      - "1025:1025"  # SMTP port
      - "8025:8025"  # Web UI
    networks:
      - pedidos-test-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8025"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_test_data:
  mongodb_test_data:
  rabbitmq_test_data:

networks:
  pedidos-test-network:
    driver: bridge
