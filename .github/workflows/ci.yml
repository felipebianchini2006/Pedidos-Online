name: CI - Continuous Integration

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  GO_VERSION: '1.21'
  NODE_VERSION: '18'

jobs:
  # ============================================================================
  # Backend Services Tests
  # ============================================================================

  test-user-service:
    name: Test User Service
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/user-service/go.sum

      - name: 📦 Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-user-${{ hashFiles('services/user-service/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-user-

      - name: 📥 Download dependencies
        working-directory: ./services/user-service
        run: go mod download

      - name: 🔍 Run golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          working-directory: services/user-service
          args: --timeout=5m

      - name: 🧪 Run tests
        working-directory: ./services/user-service
        run: |
          go test ./... -v -race -coverprofile=coverage.out -covermode=atomic
          go tool cover -func=coverage.out

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./services/user-service/coverage.out
          flags: user-service
          name: user-service-coverage

  test-order-service:
    name: Test Order Service
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/order-service/go.sum

      - name: 📦 Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-order-${{ hashFiles('services/order-service/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-order-

      - name: 📥 Download dependencies
        working-directory: ./services/order-service
        run: go mod download

      - name: 🔍 Run golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          working-directory: services/order-service
          args: --timeout=5m

      - name: 🧪 Run tests
        working-directory: ./services/order-service
        run: |
          go test ./... -v -race -coverprofile=coverage.out -covermode=atomic
          go tool cover -func=coverage.out

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./services/order-service/coverage.out
          flags: order-service
          name: order-service-coverage

  test-notification-service:
    name: Test Notification Service
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/notification-service/go.sum

      - name: 📦 Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-notification-${{ hashFiles('services/notification-service/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-notification-

      - name: 📥 Download dependencies
        working-directory: ./services/notification-service
        run: go mod download

      - name: 🔍 Run golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          working-directory: services/notification-service
          args: --timeout=5m

      - name: 🧪 Run tests
        working-directory: ./services/notification-service
        run: |
          go test ./... -v -race -coverprofile=coverage.out -covermode=atomic
          go tool cover -func=coverage.out

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./services/notification-service/coverage.out
          flags: notification-service
          name: notification-service-coverage

  test-api-gateway:
    name: Test API Gateway
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/api-gateway/go.sum

      - name: 📦 Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-gateway-${{ hashFiles('services/api-gateway/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-gateway-

      - name: 📥 Download dependencies
        working-directory: ./services/api-gateway
        run: go mod download

      - name: 🔍 Run golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          working-directory: services/api-gateway
          args: --timeout=5m

      - name: 🧪 Run tests
        working-directory: ./services/api-gateway
        run: |
          go test ./... -v -race -coverprofile=coverage.out -covermode=atomic
          go tool cover -func=coverage.out

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./services/api-gateway/coverage.out
          flags: api-gateway
          name: api-gateway-coverage

  # ============================================================================
  # Frontend Tests
  # ============================================================================

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: 📥 Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 🔍 Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: 🧪 Run tests
        working-directory: ./frontend
        run: npm run test -- --passWithNoTests --coverage

      - name: 🏗️ Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: ✅ Verify build
        working-directory: ./frontend
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Build failed: dist directory not found"
            exit 1
          fi
          echo "✅ Build successful: dist directory exists"
          du -sh dist
          ls -la dist

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./frontend/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage

  # ============================================================================
  # Integration Tests
  # ============================================================================

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: 
      - test-user-service
      - test-order-service
      - test-notification-service
      - test-api-gateway
      - test-frontend
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: users_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongodb:
        image: mongo:7-jammy
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🐳 Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: 📥 Install dependencies
        run: |
          cd frontend && npm ci && cd ..
          cd scripts && npm install && cd ..

      - name: 🚀 Start services with Docker Compose
        run: |
          docker-compose up -d
          echo "⏳ Waiting for services to be ready..."
          sleep 30

      - name: 🏥 Check services health
        run: |
          chmod +x scripts/check-services.sh
          bash scripts/check-services.sh || {
            echo "⚠️ Some services are not healthy, checking logs..."
            docker-compose logs
            exit 1
          }

      - name: 🗄️ Initialize databases
        run: |
          chmod +x scripts/init-db.sh
          bash scripts/init-db.sh

      - name: 🧪 Run API integration tests
        run: |
          chmod +x scripts/test-api.sh
          bash scripts/test-api.sh

      - name: 📋 Display service logs on failure
        if: failure()
        run: |
          echo "==================== Docker Compose Logs ===================="
          docker-compose logs
          echo "============================================================="

      - name: 🛑 Stop services
        if: always()
        run: docker-compose down -v

  # ============================================================================
  # Summary Job
  # ============================================================================

  ci-success:
    name: ✅ All CI Checks Passed
    runs-on: ubuntu-latest
    needs:
      - test-user-service
      - test-order-service
      - test-notification-service
      - test-api-gateway
      - test-frontend
      - integration-tests
    if: success()
    
    steps:
      - name: 🎉 Success
        run: |
          echo "============================================"
          echo "✅ All CI checks passed successfully!"
          echo "============================================"
          echo "📦 Services tested:"
          echo "  ✅ User Service"
          echo "  ✅ Order Service"
          echo "  ✅ Notification Service"
          echo "  ✅ API Gateway"
          echo "  ✅ Frontend"
          echo "  ✅ Integration Tests"
          echo "============================================"
