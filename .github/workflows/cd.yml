name: CD - Continuous Deployment

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/pedidos-online

jobs:
  # ============================================================================
  # Build and Push Docker Images
  # ============================================================================

  build-and-push-images:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    strategy:
      matrix:
        service:
          - name: user-service
            context: ./services/user-service
            dockerfile: ./services/user-service/Dockerfile
          - name: order-service
            context: ./services/order-service
            dockerfile: ./services/order-service/Dockerfile
          - name: notification-service
            context: ./services/notification-service
            dockerfile: ./services/notification-service/Dockerfile
          - name: api-gateway
            context: ./services/api-gateway
            dockerfile: ./services/api-gateway/Dockerfile
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔐 Login to Docker Hub (if configured)
        if: secrets.DOCKER_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 📝 Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}
            ${{ secrets.DOCKER_USERNAME != '' && format('{0}/{1}-{2}', secrets.DOCKER_USERNAME, 'pedidos-online', matrix.service.name) || '' }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🏗️ Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: ✅ Image built successfully
        run: |
          echo "✅ ${{ matrix.service.name }} image built and pushed successfully"
          echo "📦 Tags: ${{ steps.meta.outputs.tags }}"

  # ============================================================================
  # Deploy to Production
  # ============================================================================

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push-images
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://pedidos-online.example.com
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.PROD_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: 📋 Get current version
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(git rev-parse --short HEAD)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📌 Deploying version: $VERSION"

      - name: 📤 Copy deployment files to server
        run: |
          scp -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            docker-compose.yml \
            .env.production \
            ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:/opt/pedidos-online/

      - name: 🚀 Deploy services
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }} << 'ENDSSH'
            
            set -e
            
            echo "============================================"
            echo "🚀 Starting deployment..."
            echo "============================================"
            
            cd /opt/pedidos-online
            
            # Backup current version
            echo "📦 Creating backup..."
            docker-compose ps > backup-$(date +%Y%m%d-%H%M%S).txt
            
            # Pull new images
            echo "📥 Pulling new images..."
            docker-compose pull
            
            # Stop old containers
            echo "🛑 Stopping old containers..."
            docker-compose down --remove-orphans
            
            # Start new containers
            echo "🚀 Starting new containers..."
            docker-compose up -d
            
            # Wait for services to be ready
            echo "⏳ Waiting for services to start..."
            sleep 30
            
            echo "✅ Deployment completed"
            echo "============================================"
          ENDSSH

      - name: 🏥 Health check
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }} << 'ENDSSH'
            
            set -e
            
            echo "============================================"
            echo "🏥 Running health checks..."
            echo "============================================"
            
            cd /opt/pedidos-online
            
            # Function to check service health
            check_service() {
              local service=$1
              local url=$2
              local max_attempts=10
              local attempt=1
              
              while [ $attempt -le $max_attempts ]; do
                echo "Checking $service (attempt $attempt/$max_attempts)..."
                if curl -f -s "$url" > /dev/null; then
                  echo "✅ $service is healthy"
                  return 0
                fi
                sleep 5
                ((attempt++))
              done
              
              echo "❌ $service health check failed"
              return 1
            }
            
            # Check all services
            check_service "API Gateway" "http://localhost:8000/health"
            check_service "User Service" "http://localhost:8001/health"
            check_service "Order Service" "http://localhost:8002/health"
            check_service "Notification Service" "http://localhost:8003/health"
            
            echo "============================================"
            echo "✅ All services are healthy"
            echo "============================================"
            
            # Display running containers
            docker-compose ps
          ENDSSH

      - name: 🔄 Rollback on failure
        if: failure()
        run: |
          echo "❌ Deployment failed, initiating rollback..."
          
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }} << 'ENDSSH'
            
            set -e
            
            echo "============================================"
            echo "🔄 Rolling back to previous version..."
            echo "============================================"
            
            cd /opt/pedidos-online
            
            # Stop failed containers
            docker-compose down
            
            # Pull previous images (using previous tag)
            docker-compose pull --ignore-pull-failures
            
            # Start previous version
            docker-compose up -d
            
            echo "✅ Rollback completed"
            echo "============================================"
          ENDSSH

      - name: 📢 Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment to production succeeded!"
            echo "🌐 Application URL: https://pedidos-online.example.com"
            echo "📌 Version: ${{ steps.get_version.outputs.version }}"
          else
            echo "❌ Deployment to production failed!"
            echo "🔄 Automatic rollback was triggered"
          fi

      - name: 🧹 Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  # ============================================================================
  # Deploy to Staging (Optional)
  # ============================================================================

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push-images
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging.pedidos-online.example.com
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.STAGING_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: 🚀 Deploy to staging
        run: |
          echo "🚀 Deploying to staging environment..."
          # Similar deployment steps as production
          echo "✅ Staging deployment completed"

      - name: 🧹 Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key

  # ============================================================================
  # Post-Deployment Tasks
  # ============================================================================

  post-deployment:
    name: Post-Deployment Tasks
    runs-on: ubuntu-latest
    needs: deploy-production
    if: success()
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📝 Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: 📊 Update deployment metrics
        run: |
          echo "📊 Deployment metrics:"
          echo "  ✅ Deployment successful"
          echo "  📌 Version: ${{ github.ref_name }}"
          echo "  ⏱️  Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "  👤 Triggered by: ${{ github.actor }}"

      - name: 🎉 Deployment summary
        run: |
          echo "============================================"
          echo "✅ CD Pipeline Completed Successfully!"
          echo "============================================"
          echo "📦 Images built and pushed:"
          echo "  ✅ user-service"
          echo "  ✅ order-service"
          echo "  ✅ notification-service"
          echo "  ✅ api-gateway"
          echo "  ✅ frontend"
          echo "🚀 Deployed to: production"
          echo "🌐 Application URL: https://pedidos-online.example.com"
          echo "============================================"
